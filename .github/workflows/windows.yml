name: Windows build

# Compiles both plug-ins with MSBuild. GitHub's Windows runners already ship the
# VS 2022 v143 toolset, so the only thing missing is the InDesign SDK.
#
# The SDK is licence-restricted and must never be committed or published. This
# repo is public, so it cannot be cached or uploaded as an artifact here either.
# Two ways to give the runner access, neither of which puts the SDK in the repo:
#
#   1. Self-hosted runner (recommended for a public repo)
#      Register a Windows machine that already has the SDK unpacked, set the
#      SDK_PATH repository variable to its location, and change `runs-on` below
#      to self-hosted. The SDK never leaves your control.
#
#   2. GitHub-hosted runner + private storage
#      Put a zip of the SDK somewhere access-controlled (S3, Azure, a private
#      release in a *different* private repo) and set the SDK_ZIP_URL secret to
#      a pre-signed URL. Note this hands a copy to GitHub's infrastructure;
#      check that against your SDK licence before relying on it.
#
# Without either, the job stops early with an explanation rather than failing
# with a confusing compile error.

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'
      - 'build/win/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Locate or fetch the SDK
        id: sdk
        shell: pwsh
        env:
          SDK_ZIP_URL: ${{ secrets.SDK_ZIP_URL }}
          SDK_PATH: ${{ vars.SDK_PATH }}
        run: |
          if ($env:SDK_PATH -and (Test-Path "$env:SDK_PATH\build\win\prj")) {
            "Using SDK already on this runner: $env:SDK_PATH"
            "path=$env:SDK_PATH" >> $env:GITHUB_OUTPUT
            "found=true" >> $env:GITHUB_OUTPUT
          }
          elseif ($env:SDK_ZIP_URL) {
            "Downloading SDK"
            Invoke-WebRequest -Uri $env:SDK_ZIP_URL -OutFile sdk.zip
            Expand-Archive sdk.zip -DestinationPath sdk-unpacked
            # Tolerate the zip having a single top-level folder or not.
            $root = Get-ChildItem sdk-unpacked -Directory |
                    Where-Object { Test-Path "$($_.FullName)\build\win\prj" } |
                    Select-Object -First 1
            $path = if ($root) { $root.FullName } else { "$PWD\sdk-unpacked" }
            "path=$path" >> $env:GITHUB_OUTPUT
            "found=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "::warning::No SDK available, skipping the build."
            "::warning::Set the SDK_PATH variable (self-hosted) or the SDK_ZIP_URL secret. See the comments in this workflow."
            "found=false" >> $env:GITHUB_OUTPUT
          }

      - uses: microsoft/setup-msbuild@v2
        if: steps.sdk.outputs.found == 'true'

      - name: Pick a toolset the SDK supports
        id: toolset
        if: steps.sdk.outputs.found == 'true'
        shell: pwsh
        run: |
          # sdk/source/precomp/msvc/xlocnum_hack.h patches a copy of the MSVC
          # <xlocnum> header and hard-fails on any _MSC_VER it has not been
          # updated for. The newest it knows about is 1942 (VS 17.12), so the
          # runner's default toolset is too new. Pick the newest installed one
          # that the SDK actually supports.
          # Toolset x.y -> _MSC_VER 1xy0-ish, matched against the ranges in
          # xlocnum_hack.h. Newest supported first.
          $ok = '14.42', '14.39', '14.38', '14.31', '14.29'  # 1942, 1939, 1938, 1931, 1929
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dir = Join-Path $vs 'VC\Tools\MSVC'
          $installed = Get-ChildItem $dir -Directory | ForEach-Object { $_.Name } | Sort-Object -Descending
          "Installed toolsets: $($installed -join ', ')"
          $pick = $installed | Where-Object { $v = $_; $ok | Where-Object { $v.StartsWith($_) } } | Select-Object -First 1
          if (-not $pick) {
            throw "No SDK-compatible MSVC toolset installed. Supported: $($ok -join ', '). Found: $($installed -join ', ')."
          }
          # 14.2x is the VS 2019 compiler, which needs the v142 platform toolset;
          # 14.3x/14.4x are VS 2022 and use v143. MSVC keeps binary compatibility
          # across these, so linking against the SDK's libs is fine either way.
          $pt = if ($pick.StartsWith('14.2')) { 'v142' } else { 'v143' }
          "Using $pick with PlatformToolset $pt"
          "version=$pick" >> $env:GITHUB_OUTPUT
          "platform=$pt" >> $env:GITHUB_OUTPUT

      - name: Regenerate the project files
        if: steps.sdk.outputs.found == 'true'
        shell: pwsh
        run: |
          # genproj.py reads the source directory, so this also catches a project
          # that has drifted from the sources actually on disk.
          New-Item -ItemType Junction -Path sdk -Target "${{ steps.sdk.outputs.path }}" -ErrorAction SilentlyContinue | Out-Null
          python build/win/genproj.py
          git diff --stat -- build/win/prj

      - name: Build
        if: steps.sdk.outputs.found == 'true'
        shell: pwsh
        working-directory: build/win/prj
        env:
          SDK_DIR: ${{ steps.sdk.outputs.path }}
        run: |
          foreach ($proj in 'HttpLink.sdk.vcxproj', 'HttpLinkUI.sdk.vcxproj') {
            foreach ($cfg in 'Debug', 'Release') {
              "::group::$proj $cfg"
              # These must be global properties. The SDK's property sheets set
              # them to paths relative to the SDK's own prj directory, assuming
              # the project lives inside the SDK tree, and a PropertyGroup in our
              # project cannot outrank a PropertyGroup in an imported sheet.
              msbuild $proj /p:Configuration=$cfg /p:Platform=x64 `
                      /p:ID_SDK_DIR="$env:SDK_DIR" `
                      /p:BOOST_HEADER_SEARCH_PATH="$env:SDK_DIR\external\dva\third_party\boost_libraries" `
                      /p:DVA_ROOT="$env:SDK_DIR\external\dva" `
                      /p:DVA_SHARED="$env:SDK_DIR\external\dva\shared" `
                      /p:ID_DVA="$env:SDK_DIR\dvaUtils" `
                      /p:VCToolsVersion="${{ steps.toolset.outputs.version }}" `
                      /p:PlatformToolset="${{ steps.toolset.outputs.platform }}" `
                      /m /v:minimal
              if ($LASTEXITCODE -ne 0) { throw "$proj $cfg failed" }
              "::endgroup::"
            }
          }

      - name: Check the plug-ins came out
        if: steps.sdk.outputs.found == 'true'
        shell: pwsh
        run: |
          # A .pln with no resources loads as "not a valid plug-in", so treat a
          # missing resource folder as a build failure rather than shipping it.
          $bad = $false
          foreach ($cfg in 'debugx64', 'releasex64') {
            foreach ($name in 'HttpLink.sdk', 'HttpLinkUI.sdk') {
              $pln = "build/win/$cfg/sdk/$name.pln"
              if (-not (Test-Path $pln)) { "MISSING: $pln"; $bad = $true; continue }
              $res = "build/win/$cfg/sdk/($name Resources)"
              $n = if (Test-Path $res) { (Get-ChildItem $res -Recurse -Filter *.idrc).Count } else { 0 }
              "{0,-40} {1,8:N0} bytes, {2} resources" -f $pln, (Get-Item $pln).Length, $n
              if ($n -eq 0) { "  no compiled resources"; $bad = $true }
            }
          }
          if ($bad) { throw "build output incomplete" }

      # Deliberately not uploading an artifact: the .pln links against the SDK
      # and a public artifact is a redistribution question. Add an upload step
      # if you move this to a private repo.
